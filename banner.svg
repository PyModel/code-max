<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="code-max: evidence or it didn't happen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#151a23"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
      <path d="M72.5 0V300M1127.5 0V300"/>
      <path d="M0 72.5H1200M0 227.5H1200"/>

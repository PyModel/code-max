    <text x="1046" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#5ee2a0" text-anchor="middle">COMPLETE</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

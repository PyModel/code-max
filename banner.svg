<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="code-max: evidence or it didn't happen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#151a23"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
      <path d="M72.5 0V260M1127.5 0V260"/>
    </g>

    <rect x="72" y="76" width="6" height="58" fill="#5ee2a0"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="104" y="90" font-size="15" letter-spacing="4.5" fill="#5ee2a0" fill-opacity="0.9">AGENT SKILL</text>
      <text x="104" y="152" font-size="64" font-weight="700" letter-spacing="-1" fill="#f2f5f8">code-max</text>
      <text x="104" y="190" font-size="19" fill="#8b98a8">evidence, or it didn't happen</text>

      <g font-size="16" fill="#6c7a8c" text-anchor="end">
        <text x="1128" y="84">no stubs</text>
        <text x="1128" y="112">no fabricated output</text>
        <text x="1128" y="140">no green-washed tests</text>
      </g>

      <text x="1046" y="183" font-size="15" letter-spacing="3" fill="#5ee2a0" text-anchor="middle">COMPLETE</text>
    </g>

    <rect x="964" y="160" width="164" height="32" rx="6" fill="none" stroke="#5ee2a0" stroke-opacity="0.45"/>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>

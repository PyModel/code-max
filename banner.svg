    <text x="104" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4.5" fill="#5ee2a0" fill-opacity="0.9">AGENT SKILL</text>
    <text x="104" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="66" font-weight="700" letter-spacing="-1" fill="#f2f5f8">code-max</text>
    <text x="104" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8b98a8">evidence, or it didn't happen</text>

